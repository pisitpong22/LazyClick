name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # macos-26 because SettingsWindow uses NSGlassEffectView, which needs the macOS 26 SDK.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test
